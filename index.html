<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление столиками и заказами (Планшет)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Sidebar / Tables panel */
        .sidebar {
            width: 320px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.03);
            z-index: 10;
        }

        .sidebar-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: var(--text-main);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .tables-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .table-card {
            background: #f9fafb;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .table-card.active {
            border-color: var(--primary);
            background: #eef2ff;
        }

        .table-card.occupied { border-left: 6px solid var(--danger); }
        .table-card.reserved { border-left: 6px solid var(--warning); }
        .table-card.free { border-left: 6px solid var(--success); }

        .table-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .table-name {
            font-weight: bold;
            font-size: 1.05rem;
        }

        .table-status {
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-free { background: #d1fae5; color: #065f46; }
        .status-occupied { background: #fee2e2; color: #991b1b; }
        .status-reserved { background: #fef3c7; color: #92400e; }

        .table-details {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Main Workspace */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-color);
        }

        .top-nav {
            padding: 15px 25px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 65px;
        }

        .current-table-title {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .workspace-grid {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Menu Section */
        .menu-section {
            flex: 1.4;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
            flex-shrink: 0;
        }

        .category-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .category-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }

        .menu-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 90px;
        }

        .menu-item:active {
            transform: scale(0.96);
        }

        .menu-item-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .menu-item-price {
            color: var(--primary);
            font-weight: bold;
            font-size: 1rem;
        }

        /* Order Section */
        .order-section {
            flex: 1;
            background: var(--card-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 320px;
        }

        .order-header {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .order-items-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 0.95rem;
        }

        .order-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            background: #e5e7eb;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .order-summary {
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .summary-row.total {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
            margin-top: 8px;
        }

        .order-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .order-actions button {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 14px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .modal-content h3 {
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-size: 1rem;
        }

        /* Responsive Tablet Fixes */
        @media (max-width: 1024px) {
            body {
                flex-direction: column;
                overflow: auto;
                height: auto;
            }
            .sidebar {
                width: 100%;
                max-height: 220px;
            }
            .workspace-grid {
                flex-direction: column;
                height: auto;
            }
            .main-content {
                height: auto;
                overflow: visible;
            }
            .menu-section {
                max-height: 500px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar: Tables -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Столики</h2>
            <button class="btn" onclick="openAddTableModal()">+
