<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ресторан</title>
    <style>
        /* Стили, совместимые со старым движком WebKit (Android 4.1) */
        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }

        .header {
            background-color: #4f46e5;
            color: white;
            padding: 12px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .container {
            padding: 10px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 8px;
            border-bottom: 2px solid #4f46e5;
            padding-bottom: 4px;
        }

        /* Столики */
        .tables-grid {
            width: 100%;
            margin-bottom: 15px;
        }

        .table-btn {
            display: inline-block;
            width: 30%;
            margin: 1%;
            padding: 12px 5px;
            background-color: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            box-sizing: border-box;
        }

        .table-btn.active {
            border-color: #4f46e5;
            background-color: #eef2ff;
        }

        .table-btn.free { border-left: 6px solid #10b981; }
        .table-btn.occupied { border-left: 6px solid #ef4444; }

        /* Меню */
        .menu-grid {
            width: 100%;
        }

        .menu-btn {
            display: inline-block;
            width: 47%;
            margin: 1%;
            padding: 12px 8px;
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            vertical-align: top;
        }

        .menu-btn-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .menu-btn-price {
            color: #4f46e5;
            font-size: 13px;
            font-weight: bold;
        }

        /* Заказ */
        .order-box {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
        }

        .order-row {
            padding: 6px 0;
            border-bottom: 1px dashed #e5e7eb;
            font-size: 13px;
        }

        .btn-action {
            display: block;
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
        }

        .btn-clear {
            background-color: #ef4444;
        }

        .total-text {
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="header" id="appHeader">Выберите столик</div>

    <div class="container">
        <!-- Список столиков -->
        <div class="section-title">Столики</div>
        <div class="tables-grid" id="tablesContainer"></div>

        <!-- Меню блюд -->
        <div class="section-title">Меню</div>
        <div class="menu-grid" id="menuContainer"></div>

        <!-- Текущий заказ -->
        <div class="order-box">
            <div class="section-title" style="margin-top:0;">Текущий заказ</div>
            <div id="orderItems">
                <div style="color:#6b7280; font-size:13px;">Столик не выбран</div>
            </div>
            <div class="total-text" id="totalSum">Итого: 0.00 ₼</div>
            <button class="btn-action" onclick="checkout()">Оплатить / Закрыть чек</button>
            <button class="btn-action btn-clear" onclick="clearCurrentOrder()">Очистить заказ</button>
        </div>
    </div>

    <script>
        // Код полностью переписан на стандарт ES5 для Android 4.1
        var tables = [
            { id: 1, name: 'Стол №1', status: 'free', order: [] },
            { id: 2, name: 'Стол №2', status: 'free', order: [] },
            { id: 3, name: 'Стол №3', status: 'free', order: [] },
            { id: 4, name: 'Стол №4', status: 'free', order: [] },
            { id: 5, name: 'Стол №5', status: 'free', order: [] },
            { id: 6, name: 'VIP', status: 'free', order: [] }
        ];

        var menuItems = [
            { id: 1, name: 'Эспрессо', price: 4 },
            { id: 2, name: 'Капучино', price: 6 },
            { id: 3, name: 'Лимонад', price: 7 },
            { id: 4, name: 'Стейк', price: 32 },
            { id: 5, name: 'Салат Цезарь', price: 12 },
            { id: 6, name: 'Паста', price: 14 },
            { id: 7, name: 'Тирамису', price: 8 },
            { id: 8, name: 'Чизкейк', price: 9 }
        ];

        var currentTableId = null;

        function init() {
            renderTables();
            renderMenu();
        }

        function renderTables() {
            var container = document.getElementById('tablesContainer');
            var html = '';
            for (var i = 0; i < tables.length; i++) {
                var t = tables[i];
                var activeClass = (t.id === currentTableId) ? ' active' : '';
                html += '<div class="table-btn ' + t.status + activeClass + '" onclick="selectTable(' + t.id + ')">';
                html += t.name + '<br>';
                html += '<span style="font-size:10px; font-weight:normal;">' + (t.status === 'free' ? 'Свободен' : 'Занят') + '</span>';
                html += '</div>';
            }
            container.innerHTML = html;
        }

        function renderMenu() {
            var container = document.getElementById('menuContainer');
            var html = '';
            for (var i = 0; i < menuItems.length; i++) {
                var item = menuItems[i];
                html += '<div class="menu-btn" onclick="addToOrder(' + item.id + ')">';
                html += '<div class="menu-btn-name">' + item.name + '</div>';
                html += '<div class="menu-btn-price">' + item.price + ' ₼</div>';
                html += '</div>';
            }
            container.innerHTML = html;
        }

        function selectTable(id) {
            currentTableId = id;
            var table = getTableById(id);
            document.getElementById('appHeader').innerText = 'Заказ: ' + table.name;
            renderTables();
            renderOrder();
        }

        function addToOrder(itemId) {
            if (!currentTableId) {
                alert('Сначала нажмите на столик сверху!');
                return;
            }
            var table = getTableById(currentTableId);
            var menuItem = getMenuItemById(itemId);

            var found = false;
            for (var i = 0; i < table.order.length; i++) {
                if (table.order[i].id === itemId) {
                    table.order[i].qty += 1;
                    found = true;
                    break;
                }
            }
            if (!found) {
                table.order.push({ id: menuItem.id, name: menuItem.name, price: menuItem.price, qty: 1 });
            }

            table.status = 'occupied';
            renderTables();
            renderOrder();
        }

        function renderOrder() {
            var container = document.getElementById('orderItems');
            var table = getTableById(currentTableId);

            if (!table || table.order.length === 0) {
                container.innerHTML = '<div style="color:#6b7280; font-size:13px;">Заказ пуст</div>';
                document.getElementById('totalSum').innerText = 'Итого: 0.00 ₼';
                return;
            }

            var html = '';
            var subtotal = 0;
            for (var i = 0; i < table.order.length; i++) {
                var item = table.order[i];
                var sum = item.price * item.qty;
                subtotal += sum;
                html += '<div class="order-row">';
                html += '<b>' + item.name + '</b> — ' + item.qty + ' шт. × ' + item.price + ' ₼ = ' + sum + ' ₼';
                html += '</div>';
            }

            var grandTotal = subtotal * 1.10; // +10% обслуживание
            container.innerHTML = html;
            document.getElementById('totalSum').innerText = 'Итого (+10% обсл.): ' + grandTotal.toFixed(2) + ' ₼';
        }

        function clearCurrentOrder() {
            if (!currentTableId) return;
            var table = getTableById(currentTableId);
            table.order = [];
            table.status = 'free';
            renderTables();
            renderOrder();
        }

        function checkout() {
            if (!currentTableId) return;
            var table = getTableById(currentTableId);
            if (table.order.length === 0) {
                alert('Заказ пуст!');
                return;
            }
            alert('Счет закрыт! Спасибо.');
            clearCurrentOrder();
        }

        function getTableById(id) {
            for (var i = 0; i < tables.length; i++) {
                if (tables[i].id === id) return tables[i];
            }
            return null;
        }

        function getMenuItemById(id) {
            for (var i = 0; i < menuItems.length; i++) {
                if (menuItems[i].id === id) return menuItems[i];
            }
            return null;
        }

        init();
    </script>
</body>
</html>
