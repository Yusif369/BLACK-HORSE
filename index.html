<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black Horse - Управление столиками и заказами</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Menu Drawer / Sidebar Header */
        .hamburger-btn {
            background: transparent;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
            color: var(--text-main);
        }

        /* Sidebar / Tables panel */
        .sidebar {
            width: 320px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.03);
            z-index: 10;
        }

        .sidebar-header {
            padding: 15px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: var(--text-main);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .tables-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .table-card {
            background: #f9fafb;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .table-card.active {
            border-color: var(--primary);
            background: #eef2ff;
        }

        .table-card.occupied { border-left: 6px solid var(--danger); }
        .table-card.reserved { border-left: 6px solid var(--warning); }
        .table-card.free { border-left: 6px solid var(--success); }

        .table-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .table-name {
            font-weight: bold;
            font-size: 1.05rem;
        }

        .table-status {
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-free { background: #d1fae5; color: #065f46; }
        .status-occupied { background: #fee2e2; color: #991b1b; }
        .status-reserved { background: #fef3c7; color: #92400e; }

        .table-details {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Main Workspace */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-color);
        }

        .top-nav {
            padding: 15px 25px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 65px;
        }

        .current-table-title {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .workspace-grid {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Menu Section */
        .menu-section {
            flex: 1.4;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .menu-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-shrink: 0;
            gap: 10px;
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            flex: 1;
        }

        .category-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .category-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }

        .menu-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 90px;
            position: relative;
        }

        .menu-item:active {
            transform: scale(0.96);
        }

        .menu-item-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .menu-item-price {
            color: var(--primary);
            font-weight: bold;
            font-size: 1rem;
        }

        /* Order Section */
        .order-section {
            flex: 1;
            background: var(--card-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 320px;
        }

        .order-header {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .order-items-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 0.95rem;
        }

        .order-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            background: #e5e7eb;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .order-summary {
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .summary-row.total {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
            margin-top: 8px;
        }

        .order-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .order-actions button {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 14px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-header h3 {
            margin-bottom: 0;
        }

        .close-modal-btn {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0 6px;
            line-height: 1;
            border-radius: 4px;
        }

        .close-modal-btn:hover {
            color: var(--text-main);
            background: #f3f4f6;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: white;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .manage-list {
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 8px;
            background: #fafafa;
        }

        /* Единый тонкий кастомный скроллбар для всех прокручиваемых элементов */
        .modal-content::-webkit-scrollbar,
        .manage-list::-webkit-scrollbar,
        .sidebar::-webkit-scrollbar,
        .tables-list::-webkit-scrollbar,
        .menu-section::-webkit-scrollbar,
        .order-items-list::-webkit-scrollbar,
        .history-list::-webkit-scrollbar {
            width: 5px;
        }

        .modal-content::-webkit-scrollbar-track,
        .manage-list::-webkit-scrollbar-track,
        .sidebar::-webkit-scrollbar-track,
        .tables-list::-webkit-scrollbar-track,
        .menu-section::-webkit-scrollbar-track,
        .order-items-list::-webkit-scrollbar-track,
        .history-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .modal-content::-webkit-scrollbar-thumb,
        .manage-list::-webkit-scrollbar-thumb,
        .sidebar::-webkit-scrollbar-thumb,
        .tables-list::-webkit-scrollbar-thumb,
        .menu-section::-webkit-scrollbar-thumb,
        .order-items-list::-webkit-scrollbar-thumb,
        .history-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .modal-content::-webkit-scrollbar-thumb:hover,
        .manage-list::-webkit-scrollbar-thumb:hover,
        .sidebar::-webkit-scrollbar-thumb:hover,
        .tables-list::-webkit-scrollbar-thumb:hover,
        .menu-section::-webkit-scrollbar-thumb:hover,
        .order-items-list::-webkit-scrollbar-thumb:hover,
        .history-list::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .manage-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-size: 1rem;
        }

        /* Stats & History Styling */
        .stat-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .stat-card .val {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
        }

        .history-list {
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            background: #fafafa;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.85rem;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        /* Calculator Styling */
        .calc-display {
            width: 100%;
            padding: 10px;
            font-size: 1.2rem;
            text-align: right;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #f9fafb;
            font-weight: bold;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .calc-btn {
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #ffffff;
            cursor: pointer;
        }

        .calc-btn:active {
            background: #e2e8f0;
        }

        .calc-btn.op {
            background: #e0e7ff;
            color: var(--primary);
        }

        /* Responsive Tablet Fixes */
        @media (max-width: 1024px) {
            body {
                flex-direction: column;
                overflow: auto;
                height: auto;
            }
            .sidebar {
                width: 100%;
                max-height: 220px;
            }
            .workspace-grid {
                flex-direction: column;
                height: auto;
            }
            .main-content {
                height: auto;
                overflow: visible;
            }
            .menu-section {
                max-height: 500px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar: Tables -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-header-left">
                <button class="hamburger-btn" onclick="openNavModal()">☰</button>
                <h2>Black Horse</h2>
            </div>
            <button class="btn btn-secondary" onclick="openAdminModal()">⚙ Редактировать</button>
        </div>
        <div class="tables-list" id="tablesList"></div>
    </div>

    <!-- Main Workspace -->
    <div class="main-content">
        <div class="top-nav">
            <div class="current-table-title" id="currentTableTitle">Выберите столик</div>
            <div id="tableStatusActions"></div>
        </div>

        <div class="workspace-grid">
            <!-- Menu Section -->
            <div class="menu-section">
                <div class="menu-top-bar">
                    <div class="categories" id="categoriesContainer"></div>
                </div>
                <div class="menu-grid" id="menuGrid"></div>
            </div>

            <!-- Order / Bill Section -->
            <div class="order-section">
                <div>
                    <div class="order-header">Текущий заказ</div>
                    <div class="order-items-list" id="orderItemsList">
                        <div class="empty-state">Столик не выбран или заказ пуст</div>
                    </div>
                </div>

                <div class="order-summary" id="orderSummaryContainer" style="display: none;">
                    <div class="summary-row">
                        <span>Сумма:</span>
                        <span id="subTotal">0.00 ₼</span>
                    </div>
                    <div class="summary-row">
                        <span>Обслуживание (10%):</span>
                        <span id="serviceFee">0.00 ₼</span>
                    </div>
                    <div class="summary-row total">
                        <span>Итого к оплате:</span>
                        <span id="grandTotal">0.00 ₼</span>
                    </div>
                    <div class="order-actions">
                        <button class="btn btn-secondary" onclick="clearOrder()">Очистить</button>
                        <button class="btn" onclick="checkoutOrder()">Оплатить / Закрыть</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Navigation / Settings / Daily Report / History / Calculator -->
    <div class="modal" id="navModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Меню и Настройки</h3>
                <button class="close-modal-btn" onclick="closeNavModal()">×</button>
            </div>

            <!-- Section: Daily Report -->
            <div class="form-group">
                <label><b>📊 Сведения за сегодняшний день</b></label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="stat-card">
                        <div style="font-size:0.8rem; color:var(--text-muted);">Выручка</div>
                        <div class="val" id="dailyRevenue">0.00 ₼</div>
                    </div>
                    <div class="stat-card">
                        <div style="font-size:0.8rem; color:var(--text-muted);">Обслужено столов</div>
                        <div class="val" id="dailyTables">0</div>
                    </div>
                </div>
                <button class="btn btn-danger" style="width: 100%; margin-top: 8px;" onclick="startNewDay()">🌅 Начать новый день</button>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

            <!-- Section: Days History -->
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label style="margin: 0;"><b>📜 История смен (учет)</b></label>
                    <button class="btn btn-secondary" style="padding: 2px 8px; font-size: 0.75rem;" onclick="clearHistory()">Очистить историю</button>
                </div>
                <div class="history-list" id="historyList"></div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

            <!-- Section: Calculator -->
            <div class="form-group">
                <label><b>🧮 Быстрый калькулятор</b></label>
                <input type="text" id="calcDisplay" class="calc-display" value="0" readonly>
                <div class="calc-grid">
                    <button class="calc-btn" onclick="calcClear()">C</button>
                    <button class="calc-btn op" onclick="calcAppend('/')">/</button>
                    <button class="calc-btn op" onclick="calcAppend('*')">*</button>
                    <button class="calc-btn op" onclick="calcAppend('-')">-</button>
                    
                    <button class="calc-btn" onclick="calcAppend('7')">7</button>
                    <button class="calc-btn" onclick="calcAppend('8')">8</button>
                    <button class="calc-btn" onclick="calcAppend('9')">9</button>
                    <button class="calc-btn op" onclick="calcAppend('+')">+</button>
                    
                    <button class="calc-btn" onclick="calcAppend('4')">4</button>
                    <button class="calc-btn" onclick="calcAppend('5')">5</button>
                    <button class="calc-btn" onclick="calcAppend('6')">6</button>
                    <button class="calc-btn op" onclick="calcEval()" style="grid-row: span 2; height: 100%;">=</button>
                    
                    <button class="calc-btn" onclick="calcAppend('1')">1</button>
                    <button class="calc-btn" onclick="calcAppend('2')">2</button>
                    <button class="calc-btn" onclick="calcAppend('3')">3</button>
                    
                    <button class="calc-btn" onclick="calcAppend('0')" style="grid-column: span 2;">0</button>
                    <button class="calc-btn" onclick="calcAppend('.')">.</button>
                </div>
            </div>

            <div class="modal-buttons" style="margin-top: 20px;">
                <button class="btn btn-secondary" onclick="closeNavModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Modal: Admin Management (Edit / Add / Remove) -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Панель управления</h3>
                <button class="close-modal-btn" onclick="closeAdminModal()">×</button>
            </div>

            <!-- Section: Tables Management -->
            <div class="form-group">
                <label><b>Управление столиками</b></label>
                <div class="manage-list" id="manageTablesList"></div>
            </div>
            <div class="form-group">
                <label>Добавить новый столик</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="newTableName" placeholder="Например: Стол №4">
                    <button class="btn" onclick="createTable()">Добавить</button>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

            <!-- Section: Dishes Management -->
            <div class="form-group">
                <label><b>Управление блюдами в меню</b></label>
                <div class="manage-list" id="manageDishesList"></div>
            </div>
            <div class="form-group">
                <label>Добавить новое блюдо</label>
                <input type="text" id="newDishName" placeholder="Название блюда" style="margin-bottom: 8px;">
                <select id="newDishCategory" style="margin-bottom: 8px;">
                    <option value="drinks">Напитки</option>
                    <option value="hot">Горячие блюда</option>
                    <option value="salads">Салаты</option>
                    <option value="desserts">Десерты</option>
                </select>
                <input type="number" id="newDishPrice" placeholder="Цена (₼)" style="margin-bottom: 8px;">
                <button class="btn" style="width: 100%;" onclick="createDish()">Добавить блюдо</button>
            </div>

            <div class="modal-buttons" style="margin-top: 20px;">
                <button class="btn btn-secondary" onclick="closeAdminModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        let tables = JSON.parse(localStorage.getItem('bh_tables')) || [
            { id: 1, name: 'Стол №1 (Основной зал)', status: 'free', order: [] },
            { id: 2, name: 'Стол №2 (У окна)', status: 'free', order: [] },
            { id: 3, name: 'Стол №3 (VIP)', status: 'free', order: [] },
        ];

        let menuItems = JSON.parse(localStorage.getItem('bh_menu')) || [
            { id: 1, category: 'drinks', name: 'Эспрессо', price: 4 },
            { id: 2, category: 'drinks', name: 'Капучино', price: 6 },
            { id: 3, category: 'drinks', name: 'Лимонад', price: 7 },
            { id: 4, category: 'hot', name: 'Стейк Рибай', price: 32 },
            { id: 5, category: 'salads', name: 'Цезарь', price: 12 },
            { id: 6, category: 'hot', name: 'Карбонара', price: 14 },
            { id: 7, category: 'desserts', name: 'Тирамису', price: 8 },
            { id: 8, category: 'desserts', name: 'Чизкейк', price: 9 }
        ];

        let stats = JSON.parse(localStorage.getItem('bh_stats')) || {
            revenue: 0,
            tablesCount: 0
        };

        let daysHistory = JSON.parse(localStorage.getItem('bh_history')) || [];

        const menuCategories = [
            { id: 'all', name: 'Все' },
            { id: 'drinks', name: 'Напитки' },
            { id: 'hot', name: 'Горячие блюда' },
            { id: 'salads', name: 'Салаты' },
            { id: 'desserts', name: 'Десерты' }
        ];

        let currentTableId = null;
        let activeCategory = 'all';

        function saveData() {
            localStorage.setItem('bh_tables', JSON.stringify(tables));
            localStorage.setItem('bh_menu', JSON.stringify(menuItems));
            localStorage.setItem('bh_stats', JSON.stringify(stats));
            localStorage.setItem('bh_history', JSON.stringify(daysHistory));
        }

        function init() {
            renderTables();
            renderCategories();
            renderMenu();
            updateStatsUI();
            renderHistoryUI();
        }

        function renderTables() {
            const container = document.getElementById('tablesList');
            container.innerHTML = '';

            tables.forEach(table => {
                const isSelected = table.id === currentTableId;
                const totalSum = table.order.reduce((sum, item) => sum + (item.price * item.qty), 0);
                
                let statusText = 'Свободен';
                if (table.status === 'occupied') statusText = 'Занят';
                if (table.status === 'reserved') statusText = 'Забронирован';

                const card = document.createElement('div');
                card.className = `table-card ${table.status} ${isSelected ? 'active' : ''}`;
                card.onclick = () => selectTable(table.id);
                card.innerHTML = `
                    <div class="table-info">
                        <span class="table-name">${table.name}</span>
                        <span class="table-status status-${table.status}">${statusText}</span>
                    </div>
                    <div class="table-details">
                        <span>Заказ: ${totalSum > 0 ? totalSum + ' ₼' : 'нет'}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectTable(id) {
            currentTableId = id;
            renderTables();
            renderWorkspace();
        }

        function renderWorkspace() {
            const titleEl = document.getElementById('currentTableTitle');
            const summaryContainer = document.getElementById('orderSummaryContainer');
            const table = tables.find(t => t.id === currentTableId);

            if (!table) {
                titleEl.innerText = 'Выберите столик';
                summaryContainer.style.display = 'none';
                document.getElementById('orderItemsList').innerHTML = '<div class="empty-state">Столик не выбран</div>';
                return;
            }

            titleEl.innerText = table.name;
            summaryContainer.style.display = 'block';
            renderOrderItems();
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';

            menuCategories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `category-btn ${activeCategory === cat.id ? 'active' : ''}`;
                btn.innerText = cat.name;
                btn.onclick = () => {
                    activeCategory = cat.id;
                    renderCategories();
                    renderMenu();
                };
                container.appendChild(btn);
            });
        }

        function renderMenu() {
            const container = document.getElementById('menuGrid');
            container.innerHTML = '';

            const filtered = activeCategory === 'all' 
                ? menuItems 
                : menuItems.filter(i => i.category === activeCategory);

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'menu-item';
                card.onclick = () => addToOrder(item);
                card.innerHTML = `
                    <div class="menu-item-name">${item.name}</div>
                    <div class="menu-item-price">${item.price} ₼</div>
                `;
                container.appendChild(card);
            });
        }

        function addToOrder(menuItem) {
            if (!currentTableId) {
                alert('Пожалуйста, выберите столик!');
                return;
            }

            const table = tables.find(t => t.id === currentTableId);
            const existing = table.order.find(i => i.id === menuItem.id);

            if (existing) {
                existing.qty++;
            } else {
                table.order.push({ ...menuItem, qty: 1 });
            }

            table.status = 'occupied';
            saveData();
            renderTables();
            renderOrderItems();
        }

        function renderOrderItems() {
            const container = document.getElementById('orderItemsList');
            const table = tables.find(t => t.id === currentTableId);

            if (!table || table.order.length === 0) {
                container.innerHTML = '<div class="empty-state">Заказ пуст. Выберите блюда из меню.</div>';
                updateSummary(0);
                return;
            }

            container.innerHTML = '';
            let subtotal = 0;

            table.order.forEach(item => {
                const itemTotal = item.price * item.qty;
                subtotal += itemTotal;

                const row = document.createElement('div');
                row.className = 'order-item-row';
                row.innerHTML = `
                    <div>
                        <div style="font-weight: 500;">${item.name}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">${item.price} ₼ × ${item.qty} = ${itemTotal} ₼</div>
                    </div>
                    <div class="order-item-controls">
                        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                `;
                container.appendChild(row);
            });

            updateSummary(subtotal);
        }

        function changeQty(itemId, delta) {
            const table = tables.find(t => t.id === currentTableId);
            const itemIndex = table.order.findIndex(i => i.id === itemId);

            if (itemIndex > -1) {
                table.order[itemIndex].qty += delta;
                if (table.order[itemIndex].qty <= 0) {
                    table.order.splice(itemIndex, 1);
                }
            }

            if (table.order.length === 0) {
                table.status = 'free';
            }

            saveData();
            renderTables();
            renderOrderItems();
        }

        function updateSummary(subtotal) {
            const serviceFee = subtotal * 0.10;
            const grandTotal = subtotal + serviceFee;

            document.getElementById('subTotal').innerText = subtotal.toFixed(2) + ' ₼';
            document.getElementById('serviceFee').innerText = serviceFee.toFixed(2) + ' ₼';
            document.getElementById('grandTotal').innerText = grandTotal.toFixed(2) + ' ₼';
        }

        function clearOrder() {
            const table = tables.find(t => t.id === currentTableId);
            if (table) {
                table.order = [];
                table.status = 'free';
                saveData();
                renderTables();
                renderOrderItems();
            }
        }

        function checkoutOrder() {
            const table = tables.find(t => t.id === currentTableId);
            if (!table || table.order.length === 0) return;

            const subtotal = table.order.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const total = subtotal * 1.10;

            stats.revenue += total;
            stats.tablesCount += 1;

            alert(`Столик "${table.name}" закрыт!\nИтого к оплате: ${total.toFixed(2)} ₼`);
            
            table.order = [];
            table.status = 'free';
            saveData();
            updateStatsUI();
            renderTables();
            renderOrderItems();
        }

        function updateStatsUI() {
            document.getElementById('dailyRevenue').innerText = stats.revenue.toFixed(2) + ' ₼';
            document.getElementById('dailyTables').innerText = stats.tablesCount;
        }

        function renderHistoryUI() {
            const container = document.getElementById('historyList');
            container.innerHTML = '';

            if (daysHistory.length === 0) {
                container.innerHTML = '<div style="font-size:0.85rem; color:#6b7280; text-align:center; padding:10px;">История пуста</div>';
                return;
            }

            daysHistory.slice().reverse().forEach(entry => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div>
                        <div style="font-weight: 600;">${entry.date}</div>
                        <div style="color: var(--text-muted); font-size: 0.75rem;">Столов: ${entry.tablesCount}</div>
                    </div>
                    <div style="font-weight: bold; color: var(--primary);">${entry.revenue.toFixed(2)} ₼</div>
                `;
                container.appendChild(item);
            });
        }

        function startNewDay() {
            if (confirm('Вы уверены, что хотите начать новый день? Текущие показатели будут сохранены в историю, а текущий день обнулится.')) {
                if (stats.revenue > 0 || stats.tablesCount > 0) {
                    const now = new Date();
                    const dateStr = now.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                    
                    daysHistory.push({
                        date: dateStr,
                        revenue: stats.revenue,
                        tablesCount: stats.tablesCount
                    });
                }

                stats.revenue = 0;
                stats.tablesCount = 0;
                tables.forEach(t => {
                    t.order = [];
                    t.status = 'free';
                });

                saveData();
                updateStatsUI();
                renderHistoryUI();
                renderTables();
                renderWorkspace();
                alert('Новый день успешно начат! Запись сохранена в историю.');
            }
        }

        function clearHistory() {
            if (confirm('Удалить всю сохраненную историю смен?')) {
                daysHistory = [];
                saveData();
                renderHistoryUI();
            }
        }

        // Калькулятор
        let calcExpr = '';
        function calcAppend(val) {
            const disp = document.getElementById('calcDisplay');
            if (disp.value === '0' || disp.value === 'Ошибка') {
                calcExpr = val;
            } else {
                calcExpr += val;
            }
            disp.value = calcExpr;
        }

        function calcClear() {
            calcExpr = '';
            document.getElementById('calcDisplay').value = '0';
        }

        function calcEval() {
            const disp = document.getElementById('calcDisplay');
            try {
                if (!calcExpr) return;
                let res = Function('"use strict";return (' + calcExpr + ')')();
                disp.value = res;
                calcExpr = res.toString();
            } catch (e) {
                disp.value = 'Ошибка';
                calcExpr = '';
            }
        }

        function openNavModal() {
            updateStatsUI();
            renderHistoryUI();
            document.getElementById('navModal').style.display = 'flex';
        }

        function closeNavModal() {
            document.getElementById('navModal').style.display = 'none';
        }

        function openAdminModal() {
            renderManageLists();
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
            document.getElementById('newTableName').value = '';
            document.getElementById('newDishName').value = '';
            document.getElementById('newDishPrice').value = '';
        }

        function renderManageLists() {
            const tContainer = document.getElementById('manageTablesList');
            tContainer.innerHTML = '';
            if (tables.length === 0) {
                tContainer.innerHTML = '<div style="font-size:0.85rem; color:#6b7280; text-align:center; padding:10px;">Нет столиков</div>';
            } else {
                tables.forEach(t => {
                    const row = document.createElement('div');
                    row.className = 'manage-item-row';
                    row.innerHTML = `
                        <span>${t.name}</span>
                        <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem;" onclick="deleteTable(${t.id})">Удалить</button>
                    `;
                    tContainer.appendChild(row);
                });
            }

            const dContainer = document.getElementById('manageDishesList');
            dContainer.innerHTML = '';
            if (menuItems.length === 0) {
                dContainer.innerHTML = '<div style="font-size:0.85rem; color:#6b7280; text-align:center; padding:10px;">Меню пусто</div>';
            } else {
                menuItems.forEach(d => {
                    const row = document.createElement('div');
                    row.className = 'manage-item-row';
                    row.innerHTML = `
                        <span>${d.name} (${d.price} ₼)</span>
                        <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem;" onclick="deleteDish(${d.id})">Удалить</button>
                    `;
                    dContainer.appendChild(row);
                });
            }
        }

        function createTable() {
            const nameInput = document.getElementById('newTableName');
            const name = nameInput.value.trim();
            if (!name) {
                alert('Введите название столика!');
                return;
            }

            tables.push({
                id: Date.now(),
                name: name,
                status: 'free',
                order: []
            });

            saveData();
            nameInput.value = '';
            renderTables();
            renderManageLists();
        }

        function deleteTable(id) {
            tables = tables.filter(t => t.id !== id);
            if (currentTableId === id) {
                currentTableId = null;
                renderWorkspace();
            }
            saveData();
            renderTables();
            renderManageLists();
        }

        function createDish() {
            const name = document.getElementById('newDishName').value.trim();
            const category = document.getElementById('newDishCategory').value;
            const price = parseFloat(document.getElementById('newDishPrice').value);

            if (!name || isNaN(price) || price <= 0) {
                alert('Пожалуйста, введите корректное название и цену блюда!');
                return;
            }

            menuItems.push({
                id: Date.now(),
                category: category,
                name: name,
                price: price
            });

            saveData();
            document.getElementById('newDishName').value = '';
            document.getElementById('newDishPrice').value = '';
            renderMenu();
            renderManageLists();
        }

        function deleteDish(id) {
            menuItems = menuItems.filter(d => d.id !== id);
            saveData();
            renderMenu();
            renderManageLists();
        }

        init();
    </script>
</body>
</html>
