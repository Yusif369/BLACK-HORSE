<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black Horse - Управление столиками и заказами</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Sidebar / Tables panel */
        .sidebar {
            width: 320px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.03);
            z-index: 10;
        }

        .sidebar-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: var(--text-main);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .tables-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .table-card {
            background: #f9fafb;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .table-card.active {
            border-color: var(--primary);
            background: #eef2ff;
        }

        .table-card.occupied { border-left: 6px solid var(--danger); }
        .table-card.reserved { border-left: 6px solid var(--warning); }
        .table-card.free { border-left: 6px solid var(--success); }

        .table-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .table-name {
            font-weight: bold;
            font-size: 1.05rem;
        }

        .table-status {
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-free { background: #d1fae5; color: #065f46; }
        .status-occupied { background: #fee2e2; color: #991b1b; }
        .status-reserved { background: #fef3c7; color: #92400e; }

        .table-details {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Main Workspace */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-color);
        }

        .top-nav {
            padding: 15px 25px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 65px;
        }

        .current-table-title {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .workspace-grid {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Menu Section */
        .menu-section {
            flex: 1.4;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .menu-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-shrink: 0;
            gap: 10px;
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            flex: 1;
        }

        .category-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .category-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }

        .menu-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 90px;
        }

        .menu-item:active {
            transform: scale(0.96);
        }

        .menu-item-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .menu-item-price {
            color: var(--primary);
            font-weight: bold;
            font-size: 1rem;
        }

        /* Order Section */
        .order-section {
            flex: 1;
            background: var(--card-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 320px;
        }

        .order-header {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .order-items-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 0.95rem;
        }

        .order-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            background: #e5e7eb;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .order-summary {
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .summary-row.total {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
            margin-top: 8px;
        }

        .order-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .order-actions button {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 14px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .modal-content h3 {
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: white;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-size: 1rem;
        }

        /* Responsive Tablet Fixes */
        @media (max-width: 1024px) {
            body {
                flex-direction: column;
                overflow: auto;
                height: auto;
            }
            .sidebar {
                width: 100%;
                max-height: 220px;
            }
            .workspace-grid {
                flex-direction: column;
                height: auto;
            }
            .main-content {
                height: auto;
                overflow: visible;
            }
            .menu-section {
                max-height: 500px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar: Tables -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Black Horse</h2>
            <button class="btn" onclick="openAddTableModal()">+ Столик</button>
        </div>
        <div class="tables-list" id="tablesList"></div>
    </div>

    <!-- Main Workspace -->
    <div class="main-content">
        <div class="top-nav">
            <div class="current-table-title" id="currentTableTitle">Выберите столик</div>
            <div id="tableStatusActions"></div>
        </div>

        <div class="workspace-grid">
            <!-- Menu Section -->
            <div class="menu-section">
                <div class="menu-top-bar">
                    <div class="categories" id="categoriesContainer"></div>
                    <button class="btn" style="white-space: nowrap;" onclick="openAddDishModal()">+ Блюдо</button>
                </div>
                <div class="menu-grid" id="menuGrid"></div>
            </div>

            <!-- Order / Bill Section -->
            <div class="order-section">
                <div>
                    <div class="order-header">Текущий заказ</div>
                    <div class="order-items-list" id="orderItemsList">
                        <div class="empty-state">Столик не выбран или заказ пуст</div>
                    </div>
                </div>

                <div class="order-summary" id="orderSummaryContainer" style="display: none;">
                    <div class="summary-row">
                        <span>Сумма:</span>
                        <span id="subTotal">0.00 ₼</span>
                    </div>
                    <div class="summary-row">
                        <span>Обслуживание (10%):</span>
                        <span id="serviceFee">0.00 ₼</span>
                    </div>
                    <div class="summary-row total">
                        <span>Итого к оплате:</span>
                        <span id="grandTotal">0.00 ₼</span>
                    </div>
                    <div class="order-actions">
                        <button class="btn btn-secondary" onclick="clearOrder()">Очистить</button>
                        <button class="btn" onclick="checkoutOrder()">Оплатить / Закрыть</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Add Table -->
    <div class="modal" id="addTableModal">
        <div class="modal-content">
            <h3>Добавить новый столик</h3>
            <div class="form-group">
                <label>Название / Номер столика</label>
                <input type="text" id="newTableName" placeholder="Например: Стол №5">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeAddTableModal()">Отмена</button>
                <button class="btn" onclick="createTable()">Создать</button>
            </div>
        </div>
    </div>

    <!-- Modal: Add Dish -->
    <div class="modal" id="addDishModal">
        <div class="modal-content">
            <h3>Добавить новое блюдо</h3>
            <div class="form-group">
                <label>Название блюда</label>
                <input type="text" id="newDishName" placeholder="Например: Суп Харчо">
            </div>
            <div class="form-group">
                <label>Категория</label>
                <select id="newDishCategory">
                    <option value="drinks">Напитки</option>
                    <option value="hot">Горячие блюда</option>
                    <option value="salads">Салаты</option>
                    <option value="desserts">Десерты</option>
                </select>
            </div>
            <div class="form-group">
                <label>Цена (₼)</label>
                <input type="number" id="newDishPrice" placeholder="10">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeAddDishModal()">Отмена</button>
                <button class="btn" onclick="createDish()">Добавить</button>
            </div>
        </div>
    </div>

    <script>
        // Загрузка данных из памяти устройства (если они там есть) или установка начальных
        let tables = JSON.parse(localStorage.getItem('bh_tables')) || [
            { id: 1, name: 'Стол №1 (Основной зал)', status: 'free', order: [] },
            { id: 2, name: 'Стол №2 (У окна)', status: 'free', order: [] },
            { id: 3, name: 'Стол №3 (VIP)', status: 'free', order: [] },
        ];

        let menuItems = JSON.parse(localStorage.getItem('bh_menu')) || [
            { id: 1, category: 'drinks', name: 'Эспрессо', price: 4 },
            { id: 2, category: 'drinks', name: 'Капучино', price: 6 },
            { id: 3, category: 'drinks', name: 'Лимонад', price: 7 },
            { id: 4, category: 'hot', name: 'Стейк Рибай', price: 32 },
            { id: 5, category: 'salads', name: 'Цезарь', price: 12 },
            { id: 6, category: 'hot', name: 'Карбонара', price: 14 },
            { id: 7, category: 'desserts', name: 'Тирамису', price: 8 },
            { id: 8, category: 'desserts', name: 'Чизкейк', price: 9 }
        ];

        const menuCategories = [
            { id: 'all', name: 'Все' },
            { id: 'drinks', name: 'Напитки' },
            { id: 'hot', name: 'Горячие блюда' },
            { id: 'salads', name: 'Салаты' },
            { id: 'desserts', name: 'Десерты' }
        ];

        let currentTableId = null;
        let activeCategory = 'all';

        // Функция сохранения данных в память браузера/устройства
        function saveData() {
            localStorage.setItem('bh_tables', JSON.stringify(tables));
            localStorage.setItem('bh_menu', JSON.stringify(menuItems));
        }

        function init() {
            renderTables();
            renderCategories();
            renderMenu();
        }

        function renderTables() {
            const container = document.getElementById('tablesList');
            container.innerHTML = '';

            tables.forEach(table => {
                const isSelected = table.id === currentTableId;
                const totalSum = table.order.reduce((sum, item) => sum + (item.price * item.qty), 0);
                
                let statusText = 'Свободен';
                if (table.status === 'occupied') statusText = 'Занят';
                if (table.status === 'reserved') statusText = 'Забронирован';

                const card = document.createElement('div');
                card.className = `table-card ${table.status} ${isSelected ? 'active' : ''}`;
                card.onclick = () => selectTable(table.id);
                card.innerHTML = `
                    <div class="table-info">
                        <span class="table-name">${table.name}</span>
                        <span class="table-status status-${table.status}">${statusText}</span>
                    </div>
                    <div class="table-details">
                        <span>Заказ: ${totalSum > 0 ? totalSum + ' ₼' : 'нет'}</span>
                        <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem;" onclick="event.stopPropagation(); deleteTable(${table.id})">Удалить</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectTable(id) {
            currentTableId = id;
            renderTables();
            renderWorkspace();
        }

        function renderWorkspace() {
            const titleEl = document.getElementById('currentTableTitle');
            const summaryContainer = document.getElementById('orderSummaryContainer');
            const table = tables.find(t => t.id === currentTableId);

            if (!table) {
                titleEl.innerText = 'Выберите столик';
                summaryContainer.style.display = 'none';
                document.getElementById('orderItemsList').innerHTML = '<div class="empty-state">Столик не выбран</div>';
                return;
            }

            titleEl.innerText = table.name;
            summaryContainer.style.display = 'block';
            renderOrderItems();
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';

            menuCategories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `category-btn ${activeCategory === cat.id ? 'active' : ''}`;
                btn.innerText = cat.name;
                btn.onclick = () => {
                    activeCategory = cat.id;
                    renderCategories();
                    renderMenu();
                };
                container.appendChild(btn);
            });
        }

        function renderMenu() {
            const container = document.getElementById('menuGrid');
            container.innerHTML = '';

            const filtered = activeCategory === 'all' 
                ? menuItems 
                : menuItems.filter(i => i.category === activeCategory);

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'menu-item';
                card.onclick = () => addToOrder(item);
                card.innerHTML = `
                    <div class="menu-item-name">${item.name}</div>
                    <div class="menu-item-price">${item.price} ₼</div>
                `;
                container.appendChild(card);
            });
        }

        function addToOrder(menuItem) {
            if (!currentTableId) {
                alert('Пожалуйста, выберите столик!');
                return;
            }

            const table = tables.find(t => t.id === currentTableId);
            const existing = table.order.find(i => i.id === menuItem.id);

            if (existing) {
                existing.qty++;
            } else {
                table.order.push({ ...menuItem, qty: 1 });
            }

            table.status = 'occupied';
            saveData(); // Сохраняем изменения
            renderTables();
            renderOrderItems();
        }

        function renderOrderItems() {
            const container = document.getElementById('orderItemsList');
            const table = tables.find(t => t.id === currentTableId);

            if (!table || table.order.length === 0) {
                container.innerHTML = '<div class="empty-state">Заказ пуст. Выберите блюда из меню.</div>';
                updateSummary(0);
                return;
            }

            container.innerHTML = '';
            let subtotal = 0;

            table.order.forEach(item => {
                const itemTotal = item.price * item.qty;
                subtotal += itemTotal;

                const row = document.createElement('div');
                row.className = 'order-item-row';
                row.innerHTML = `
                    <div>
                        <div style="font-weight: 500;">${item.name}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">${item.price} ₼ × ${item.qty} = ${itemTotal} ₼</div>
                    </div>
                    <div class="order-item-controls">
                        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                `;
                container.appendChild(row);
            });

            updateSummary(subtotal);
        }

        function changeQty(itemId, delta) {
            const table = tables.find(t => t.id === currentTableId);
            const itemIndex = table.order.findIndex(i => i.id === itemId);

            if (itemIndex > -1) {
                table.order[itemIndex].qty += delta;
                if (table.order[itemIndex].qty <= 0) {
                    table.order.splice(itemIndex, 1);
                }
            }

            if (table.order.length === 0) {
                table.status = 'free';
            }

            saveData(); // Сохраняем изменения
            renderTables();
            renderOrderItems();
        }

        function updateSummary(subtotal) {
            const serviceFee = subtotal * 0.10;
            const grandTotal = subtotal + serviceFee;

            document.getElementById('subTotal').innerText = subtotal.toFixed(2) + ' ₼';
            document.getElementById('serviceFee').innerText = serviceFee.toFixed(2) + ' ₼';
            document.getElementById('grandTotal').innerText = grandTotal.toFixed(2) + ' ₼';
        }

        function clearOrder() {
            const table = tables.find(t => t.id === currentTableId);
            if (table) {
                table.order = [];
                table.status = 'free';
                saveData(); // Сохраняем изменения
                renderTables();
                renderOrderItems();
            }
        }

        function checkoutOrder() {
            const table = tables.find(t => t.id === currentTableId);
            if (!table || table.order.length === 0) return;

            const subtotal = table.order.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const total = subtotal * 1.10;

            alert(`Столик "${table.name}" закрыт!\nИтого к оплате: ${total.toFixed(2)} ₼`);
            
            table.order = [];
            table.status = 'free';
            saveData(); // Сохраняем изменения
            renderTables();
            renderOrderItems();
        }

        // Управление столиками
        function openAddTableModal() {
            document.getElementById('addTableModal').style.display = 'flex';
        }

        function closeAddTableModal() {
            document.getElementById('addTableModal').style.display = 'none';
            document.getElementById('newTableName').value = '';
        }

        function createTable() {
            const nameInput = document.getElementById('newTableName');
            const name = nameInput.value.trim();
            if (!name) {
                alert('Введите название!');
                return;
            }

            tables.push({
                id: Date.now(),
                name: name,
                status: 'free',
                order: []
            });

            saveData(); // Сохраняем новый столик
            closeAddTableModal();
            renderTables();
        }

        function deleteTable(id) {
            tables = tables.filter(t => t.id !== id);
            if (currentTableId === id) currentTableId = null;
            saveData(); // Сохраняем после удаления
            renderTables();
            renderWorkspace();
        }

        // Управление блюдами в меню
        function openAddDishModal() {
            document.getElementById('addDishModal').style.display = 'flex';
        }

        function closeAddDishModal() {
            document.getElementById('addDishModal').style.display = 'none';
            document.getElementById('newDishName').value = '';
            document.getElementById('newDishPrice').value = '';
        }

        function createDish() {
            const name = document.getElementById('newDishName').value.trim();
            const category = document.getElementById('newDishCategory').value;
            const price = parseFloat(document.getElementById('newDishPrice').value);

            if (!name || isNaN(price) || price <= 0) {
                alert('Пожалуйста, введите корректное название и цену блюда!');
                return;
            }

            menuItems.push({
                id: Date.now(),
                category: category,
                name: name,
                price: price
            });

            saveData(); // Сохраняем новое блюдо
            closeAddDishModal();
            renderMenu();
        }

        init();
    </script>
</body>
</html>
